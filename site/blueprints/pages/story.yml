title: Story
icon: text
num: date

create:
  title:
    label: Headline
  fields:
    - kind

status:
  draft:
    label: Draft
    text: Only visible in the admin panel.
  unlisted:
    label: In review
    text: Reachable by direct link, not listed on the site.
  listed:
    label: Published
    text: Live on the site.

columns:
  main:
    width: 2/3
    fields:
      subtitle:
        label: Subtitle
        type: text
        placeholder: A one-line summary that hooks the reader
      text:
        label: Story
        type: blocks
        fieldsets:
          - heading
          - text
          - list
          - quote
          - image
          - gallery
          - code
          - video
          - line
  sidebar:
    width: 1/3
    sections:
      meta:
        type: fields
        fields:
          kind:
            label: Type
            type: toggles
            translate: false
            default: article
            options:
              article: Article
              blog: Blog post
          author:
            label: Author
            type: pages
            translate: false
            query: site.find("authors").children
            multiple: false
            required: true
          date:
            label: Publish date
            type: date
            translate: false
            time: false
            default: today
            required: true
          tags:
            label: Tags
            type: tags
            options:
              type: query
              query: site.find("stories").children.pluck("tags", ",", true)
          cover:
            label: Cover image
            type: files
            translate: false
            multiple: false
            uploads: cover
            query: page.images
          featured:
            label: Feature on home page
            type: toggle
            translate: false
          availableIn:
            label: Language versions
            type: checkboxes
            translate: false
            columns: 2
            default: de
            options:
              de: Deutsch
              en: English
            help: Tick every language this page has been written or translated in. A language that isn’t ticked shows the other version with a short note.
      files:
        type: files
        label: Images
        template: image
