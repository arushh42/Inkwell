title: Guide
icon: question

columns:
  - width: 2/3
    fields:
      intro:
        label: Intro
        type: textarea
        size: small
        buttons: false
      steps:
        label: Steps
        type: structure
        help: Screenshots and highlight positions are generated by tools/guides (see README). You can edit the wording here.
        columns:
          title:
            width: 1/2
          callout:
            width: 1/2
        fields:
          title:
            label: Step title
            type: text
            required: true
          text:
            label: Instructions
            type: textarea
            size: small
            buttons: [bold, italic, link]
          callout:
            label: Callout on the screenshot
            type: text
            help: Two to five words, e.g. “Click Write a story”.
          image:
            label: Screenshot
            type: files
            multiple: false
            query: page.images
          url:
            label: Address shown in the browser bar
            type: text
          box:
            label: Highlight box (x, y, width, height in %)
            type: text
            help: Generated automatically from the real page.
  - width: 1/3
    fields:
      audience:
        label: Who it’s for
        type: text
      duration:
        label: Time needed
        type: text
        placeholder: 3 minutes
      cta:
        label: Button at the end
        type: text
        help: e.g. “Write your first story”
      ctaLink:
        label: Button link
        type: text
        translate: false
        placeholder: /write
    sections:
      files:
        type: files
        label: Screenshots
        template: screenshot
